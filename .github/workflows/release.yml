name: Release

# On a version tag (v1.2.3): check that the tag matches package.json, check the
# build and the package contents, then publish to npm. npm accepts the upload
# through trusted publishing: npmjs.com trusts this workflow file in this
# repository and checks a short-lived identity token that GitHub issues to the
# run, so no npm token is stored anywhere. npm adds provenance on its own.
# One-time setup on npmjs.com and the release steps: PUBLISH.md.
on:
  push:
    tags:
      # Plain versions only, so a prerelease never becomes npm's latest.
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read
  id-token: write # trusted publishing: the identity token npm checks

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Verify tag matches package version
        shell: pwsh
        run: |
          $pkg = (Get-Content -Raw package.json | ConvertFrom-Json).version
          $tag = "${{ github.ref_name }}".TrimStart('v')
          if ($pkg -ne $tag) { throw "Tag $tag does not match package.json version $pkg" }

      - name: Check npm supports trusted publishing
        shell: pwsh
        run: |
          $npm = [version](npm --version)
          if ($npm -lt [version]'11.5.1') { throw "npm $npm cannot use trusted publishing; it needs 11.5.1 or later" }

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify build and pack hygiene
        run: npm run check:pack

      - name: Publish to npm
        run: npm publish
