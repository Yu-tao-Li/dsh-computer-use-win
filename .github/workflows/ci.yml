name: CI

on:
  push:
  pull_request:
  workflow_call:

jobs:
  selftest:
    # The backend drives a real Windows desktop (UIA + SendInput), so the
    # smoke test must run on a Windows runner with a desktop session.
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        powershell: [powershell.exe, pwsh.exe]
    env:
      WINDOWS_CU_POWERSHELL: ${{ matrix.powershell }}
      WCU_BACKEND_TRACE: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # Runtime remains dependency-free. Test-only dependencies parse the DSH
      # bundle and launch real Node/Electron children through the official SDK.
      - name: Install regression dependencies
        run: npm ci

      - name: Download Electron test runtime
        run: node test/install-electron.mjs
        env:
          WCU_ELECTRON_INSTALL_LOG: ${{ runner.temp }}/electron-install.log
        timeout-minutes: 5

      - name: Preserve Electron installation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: electron-install-${{ matrix.powershell }}
          path: ${{ runner.temp }}/electron-install.log
          if-no-files-found: warn

      # Runtime caches and artifacts are isolated per suite. Read-only smoke
      # checks use the desktop; input/activation/coordinate tests use fake APIs.
      # UIA cache smokes open/close only owned native/Chromium fixture windows.
      - name: Isolated backend regression suite
        id: regression
        run: npm test
        timeout-minutes: 15

      - name: Check generated client and native artifacts
        run: npm run check:pack

      - name: Live Firefox BiDi verification
        run: node test/browser-bidi.mjs --live

      # The one check that sends real input, so it runs here and never in the
      # isolated suite: a fixture "user" types while DSH works in another
      # window under Low disruption, and every character must land where it
      # was typed.
      - name: Live input hold
        run: node test/input-hold-live.mjs
        timeout-minutes: 5

      - name: Legacy settings page transport
        run: node test/client-settings-contract.mjs
        env:
          WCU_SETTINGS_TEST_API: legacy

      - name: Preserve regression diagnostics
        # Earlier setup failures leave artifactRoot empty. Never expand an
        # empty root into a glob covering the runner's entire drive.
        if: ${{ always() && steps.regression.outputs.artifactRoot != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: regression-${{ matrix.powershell }}
          path: |
            ${{ steps.regression.outputs.artifactRoot }}/results.json
            ${{ steps.regression.outputs.artifactRoot }}/*/*.log
            ${{ steps.regression.outputs.artifactRoot }}/*/results.json
          if-no-files-found: warn

  host-integration:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        host: ['0.1.0-rc.6', '0.1.0-rc.7', '0.2.1-rc.2', '0.2.2-rc.1', '0.2.2-rc.3', '0.2.2-rc.5']
    # The runner context is not available in job-level env, only in steps, so
    # each step that needs the fixture path sets WCU_HOST_MODULES itself.
    env:
      NODE_ENV: test
      WCU_TEST_NO_TAKEOVER: '1'
      WCU_TEST_ALL_SETTINGS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install test dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install exact host fixture
        run: node test/install-host-fixture.mjs '${{ matrix.host }}' '${{ runner.temp }}/wcu-host-${{ matrix.host }}'
      - name: Approval and real MCP bridge
        run: node test/host-policy.mjs "$env:WCU_HOST_MODULES"
        env:
          WCU_HOST_MODULES: ${{ runner.temp }}/wcu-host-${{ matrix.host }}/node_modules
      - name: Modern full settings matrix
        if: startsWith(matrix.host, '0.2.')
        run: node test/host-settings-integration.mjs "$env:WCU_HOST_MODULES"
        env:
          WCU_HOST_MODULES: ${{ runner.temp }}/wcu-host-${{ matrix.host }}/node_modules
      - name: Legacy real settings provider
        if: startsWith(matrix.host, '0.1.')
        run: node test/host-settings-legacy.mjs "$env:WCU_HOST_MODULES"
        env:
          WCU_HOST_MODULES: ${{ runner.temp }}/wcu-host-${{ matrix.host }}/node_modules
