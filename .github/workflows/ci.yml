name: CI

on:
  push:
  pull_request:

jobs:
  selftest:
    # The backend drives a real Windows desktop (UIA + SendInput), so the
    # smoke test must run on a Windows runner with a desktop session.
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        powershell: [powershell.exe, pwsh.exe]
    env:
      WINDOWS_CU_POWERSHELL: ${{ matrix.powershell }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # Runtime remains dependency-free. Test-only dependencies parse the DSH
      # bundle and launch real Node/Electron children through the official SDK.
      - name: Install regression dependencies
        run: npm ci

      - name: Download Electron test runtime
        run: node node_modules/electron/install.js
        timeout-minutes: 5

      # Runtime caches and artifacts are isolated per suite. Read-only smoke
      # checks use the desktop; input/activation/coordinate tests use fake APIs.
      - name: Isolated backend regression suite
        run: npm test
        timeout-minutes: 15
