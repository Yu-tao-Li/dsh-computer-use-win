name: 问题反馈 / Bug report
description: 插件出错或表现不对时用这个模板 / Use this when the plugin fails or does something wrong
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        从设置页点“反馈问题”打开这个页面时，环境已经填好，诊断文件 `wincu-diagnostics-….md` 已存到下载文件夹，请把它拖到下面“诊断文件和截图”一栏。上传前可以先打开看一遍：用户目录、用户名和计算机名已经替换，输入的文字只保留长度，文件里没有截图。

        Opened from "Report a problem" on the settings page, this form already has the environment, and the diagnostics file `wincu-diagnostics-….md` is in your Downloads folder: drag it into "Diagnostics file and screenshots" below. You can open it first: user folders, the user name and the computer name are replaced, typed text is kept as its length only, and it has no screenshots.
  - type: textarea
    id: what-happened
    attributes:
      label: 遇到的问题 / What happened
      description: 让 DSH 做了什么，期望是什么，实际发生了什么 / What you asked DSH to do, what you expected, and what happened instead
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤 / Steps to reproduce
      description: 能复现的话写一下步骤或用到的程序和网页 / If it happens again, the steps, apps or pages involved
  - type: textarea
    id: environment
    attributes:
      label: 环境 / Environment
      description: 从设置页打开时已自动填好 / Filled in when opened from the settings page
      render: text
  - type: textarea
    id: diagnostics
    attributes:
      label: 诊断文件和截图 / Diagnostics file and screenshots
      description: 把下载文件夹里的诊断文件拖到这里；截图也可以拖进来，注意先遮住隐私 / Drag the diagnostics file from your Downloads folder here; screenshots too, with private details covered
