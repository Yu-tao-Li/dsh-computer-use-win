# dsh-computer-use-win — DSH bundle patch layer
#
# Mounts the Windows computer-use MCP server through the in-box
# @deepseek-ai/dsh-mcp-client bridge. After DSH starts, the model sees tools
# named mcp__wincu__<tool> (health, snapshot, click, type_text, ocr, ...).
#
# Path resolution: `!!js` expressions interpolate against the boot tree's
# context, whose `baseUrl` is the PROFILE directory (where cordis.yml lives),
# not this patch file's package directory. So server.mjs is resolved as a
# package specifier through createRequire anchored at the profile's
# package.json — this works in any profile under any $DSH_HOME, survives the
# pnpm store layout, and keeps no hard-coded paths. `process.execPath` is the
# absolute node binary that is running DSH itself.

- insert:
    - id: mcp-dsh-computer-use-win
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: wincu
        transport: stdio
        command: !!js process.execPath
        args:
          - !!js "process.getBuiltinModule('node:module').createRequire(new URL('package.json', baseUrl)).resolve('dsh-computer-use-win/mcp/server.mjs')"
        toolCallTimeoutMs: 60000
        failOnStartupError: false
